name: Safe large Folium HTML vendor pinning
on:
  push:
    branches: [security/pin-folium-js-20261102]
    paths:
      - scripts/pin-folium-js.cjs
      - .github/workflows/pin-vendor-scripts.yml
  pull_request:
permissions:
  contents: write
jobs:
  pin-vendor-js:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pin-folium-js-20261102
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/pin-folium-js.cjs
      - name: Verify exact HTML substitutions only
        run: |
          git diff --numstat
          node --check scripts/pin-folium-js.cjs
      - name: Commit only HTML vendor tag updates to review branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "security: pin Folium vendor JS to SHA384 SRI"
            git push origin HEAD:security/pin-folium-js-20261102
          fi
